<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<title>BusDash</title>
<style>
  :root {
    --bg: #f4f2ee;
    --card: #ffffff;
    --text: #1d1f22;
    --muted: #6b6f76;
    --line: #e3e0da;
    --accent: #1f8a5b;
    --accent-soft: #e3f3ea;
    --sun: #d08a00;
    --warn: #c27c0e;
    --danger: #b3362b;
    --track: #cfcbc3;
    --focus: #2d6cdf;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b;
      --card: #202327;
      --text: #eceae6;
      --muted: #9a9ea5;
      --line: #30343a;
      --accent: #3fbf86;
      --accent-soft: #1d3329;
      --sun: #f2b53a;
      --warn: #e9a53b;
      --danger: #ef6b5f;
      --track: #464b52;
      --focus: #7aa7ff;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -.01em; }
  .head-right { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .conn { display: flex; align-items: center; gap: 8px; font-size: .875rem; color: var(--muted); white-space: nowrap; }
  .conn::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .conn.offline::before { background: var(--danger); }
  .logout {
    border: 1px solid var(--line); background: var(--card); border-radius: 8px;
    padding: 0 12px; min-height: 36px; cursor: pointer; font-size: .875rem; font-weight: 600;
  }
  .logout[hidden] { display: none; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  }
  h2 { font-size: 1.0625rem; margin: 8px 0 0; }

  /* ---------- De bus ---------- */
  .hero { overflow: hidden; }
  .scene { display: block; width: 100%; height: clamp(190px, 38vw, 300px); }
  .caption { padding: 14px 18px 16px; display: grid; gap: 2px; }
  .caption strong { font-size: 1.125rem; }
  .caption span { color: var(--muted); }

  .scene .m { opacity: 0; transition: opacity .8s ease; }
  .scene[data-mood="sunny"] .m-sunny,
  .scene[data-mood="awake"] .m-awake,
  .scene[data-mood="sleeping"] .m-sleeping { opacity: 1; }

  .scene .body { fill: #d3d8dd; transition: fill .8s; }
  .scene[data-mood="sleeping"] .body { fill: #8e9ab0; }
  .scene .tint { fill: #23282f; transition: fill .8s; }
  .scene[data-mood="sleeping"] .tint { fill: #151a24; }
  .scene .glass { fill: #8fb7d6; transition: fill .8s; }
  .scene[data-mood="sunny"] .glass { fill: #a9d4f2; }
  .scene[data-mood="sleeping"] .glass { fill: #2c3d5e; }
  .scene .road { fill: #8f949b; transition: fill .8s; }
  .scene[data-mood="sleeping"] .road { fill: #3a4252; }
  .scene .grass { fill: #8cc06a; transition: fill .8s; }
  .scene[data-mood="sleeping"] .grass { fill: #2f4a3a; }

  .bob { animation: bob 3.2s ease-in-out infinite; }
  .scene[data-mood="sunny"] .bob { animation: bounce 1.1s ease-in-out infinite; }
  .scene[data-mood="sleeping"] .bob { animation: breathe 4.5s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-3.5px); } 60% { transform: translateY(-3px); } }
  @keyframes breathe { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(.8px) scaleY(.995); } }

  .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .pupil { animation: look 9s ease-in-out infinite; }
  @keyframes look { 0%,40%,100% { transform: translate(0,0); } 50%,70% { transform: translate(-2.5px,0); } 80% { transform: translate(1px,-1px); } }

  .rays { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
  .scene[data-mood="sunny"] .rays { animation-duration: 10s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .beam { stroke-dasharray: 4 10; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -14; } }

  .cloud { animation: drift 26s ease-in-out infinite alternate; }
  .cloud.two { animation-duration: 34s; animation-delay: -12s; }
  @keyframes drift { from { transform: translateX(-18px); } to { transform: translateX(22px); } }

  .star { animation: twinkle 3s ease-in-out infinite; }
  .star:nth-child(2n) { animation-delay: -1.3s; }
  .star:nth-child(3n) { animation-delay: -2.1s; animation-duration: 4s; }
  @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  .z { opacity: 0; animation: zz 3.6s ease-out infinite; transform-box: fill-box; }
  .z.b { animation-delay: 1.2s; }
  .z.c { animation-delay: 2.4s; }
  @keyframes zz {
    0% { opacity: 0; transform: translate(0,0) scale(.6); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translate(16px,-34px) scale(1.25); }
  }

  .glint { animation: glint 3.5s ease-in-out infinite; }
  @keyframes glint { 0%,70%,100% { opacity: 0; } 80% { opacity: .9; } }
  .sparkle { transform-box: fill-box; transform-origin: center; animation: sparkle 2.2s ease-in-out infinite; }
  .sparkle.b { animation-delay: -.8s; }
  .sparkle.c { animation-delay: -1.5s; }
  @keyframes sparkle { 0%,100% { transform: scale(.2); opacity: 0; } 50% { transform: scale(1); opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .scene * { animation: none !important; }
  }

  /* ---------- Accu en zon ---------- */
  .stats { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 639px) { .stats { grid-template-columns: 1fr; } }
  .stat { padding: 16px 18px 18px; display: grid; gap: 12px; align-content: start; }
  .stat-head { display: flex; align-items: center; gap: 10px; }
  .stat-head svg { width: 22px; height: 22px; flex: none; }
  .stat-head h3 { font-size: 1rem; margin: 0; }
  .stat-head small { color: var(--muted); font-size: .8125rem; margin-left: auto; white-space: nowrap; }
  .big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .big b { font-size: 2.5rem; line-height: 1; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .big span { color: var(--muted); font-weight: 600; }
  .bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--accent); transition: width .6s, background-color .6s; }
  .bar.sun i { background: var(--sun); }
  dl { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  dl div { min-width: 0; }
  dt { font-size: .8125rem; color: var(--muted); }
  dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nodata { color: var(--muted); margin: 0; }

  /* ---------- Relais ---------- */
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  @media (max-width: 599px) { .grid { grid-template-columns: 1fr; } }
  .relay {
    padding: 14px 14px 14px 12px; display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 12px; min-height: 76px; transition: border-color .15s, background-color .15s;
  }
  .relay.on { border-color: var(--accent); background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft)), var(--card); }
  .num {
    width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
    font-weight: 700; font-variant-numeric: tabular-nums;
    background: var(--bg); color: var(--muted); border: 1px solid var(--line);
  }
  .relay.on .num { background: var(--accent); color: #fff; border-color: var(--accent); }
  .info { min-width: 0; }
  .name-row { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { font-size: .8125rem; color: var(--muted); }
  .relay.on .state { color: var(--accent); font-weight: 600; }
  .icon-btn {
    flex: none; border: 0; background: none; cursor: pointer; color: var(--muted);
    width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--bg); color: var(--text); }
  .icon-btn svg { width: 18px; height: 18px; }
  .switch {
    flex: none; cursor: pointer; border: 0; padding: 0; width: 60px; height: 34px; border-radius: 17px;
    background: var(--track); position: relative; transition: background-color .15s;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s;
  }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(26px); }
  .switch:disabled { opacity: .6; cursor: progress; }
  .edit { grid-column: 2 / 4; display: grid; gap: 8px; }
  .edit input {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px;
  }
  .edit input:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
  .edit-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 0 14px; min-height: 40px; cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--danger); margin-left: auto; }
  .add {
    border: 2px dashed var(--line); border-radius: 16px; background: none; cursor: pointer; min-height: 76px;
    display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-weight: 600;
  }
  .add:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .add .plus { font-size: 1.75rem; line-height: 1; font-weight: 400; }
  .add:disabled { cursor: default; opacity: .7; }

  .toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    font-size: .9375rem; max-width: calc(100% - 32px); transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main>
  <header>
    <h1>BusDash</h1>
    <div class="head-right">
      <span class="conn" id="conn" role="status">Verbinden…</span>
      <button class="logout" id="logout" type="button" hidden>Uitloggen</button>
    </div>
  </header>

  <!-- ===================== De bus en zijn stemming ===================== -->
  <section class="card hero" aria-labelledby="mood-title">
    <svg class="scene" id="scene" data-mood="awake" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax meet" role="img" aria-labelledby="mood-title">
      <defs>
        <linearGradient id="sky-sunny" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0" stop-color="#4fb3f6"/><stop offset="1" stop-color="#cdeeff"/></linearGradient>
        <linearGradient id="sky-awake" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0" stop-color="#9ebfd8"/><stop offset="1" stop-color="#e5edf2"/></linearGradient>
        <linearGradient id="sky-night" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200"><stop offset="0" stop-color="#0b1630"/><stop offset="1" stop-color="#2a3d66"/></linearGradient>
        <radialGradient id="sun-glow"><stop offset="0" stop-color="#fff3b0" stop-opacity=".9"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient>
      </defs>

      <!-- lucht: loopt ver buiten de tekening door, zodat brede schermen niets hoeven af te snijden -->
      <rect x="-800" y="-200" width="2000" height="400" fill="url(#sky-awake)"/>
      <rect class="m m-sunny" x="-800" y="-200" width="2000" height="400" fill="url(#sky-sunny)"/>
      <rect class="m m-sleeping" x="-800" y="-200" width="2000" height="400" fill="url(#sky-night)"/>

      <!-- sterren en maan -->
      <g class="m m-sleeping" fill="#fff">
        <circle class="star" cx="150" cy="22" r="1.3"/><circle class="star" cx="196" cy="40" r="1"/>
        <circle class="star" cx="238" cy="18" r="1.5"/><circle class="star" cx="290" cy="34" r="1"/>
        <circle class="star" cx="335" cy="14" r="1.3"/><circle class="star" cx="372" cy="44" r="1.1"/>
        <circle class="star" cx="116" cy="54" r="1"/><circle class="star" cx="262" cy="58" r="1.1"/>
        <circle class="star" cx="20" cy="70" r="1.2"/><circle class="star" cx="388" cy="78" r="1"/>
        <circle class="star" cx="-40" cy="30" r="1.2"/><circle class="star" cx="-110" cy="62" r="1"/>
        <circle class="star" cx="-190" cy="24" r="1.3"/><circle class="star" cx="440" cy="26" r="1.2"/>
        <circle class="star" cx="510" cy="60" r="1"/><circle class="star" cx="580" cy="20" r="1.3"/>
      </g>
      <path class="m m-sleeping" d="M66,24 a22,22 0 1,0 22,32 a17,17 0 1,1 -22,-32 z" fill="#f4edc9"/>

      <!-- zon -->
      <g class="m m-sunny m-awake">
        <circle class="m m-sunny" cx="62" cy="44" r="44" fill="url(#sun-glow)"/>
        <g class="rays" stroke="#ffc928" stroke-width="3.5" stroke-linecap="round">
          <line x1="62" y1="10" x2="62" y2="18"/><line x1="62" y1="70" x2="62" y2="78"/>
          <line x1="28" y1="44" x2="36" y2="44"/><line x1="88" y1="44" x2="96" y2="44"/>
          <line x1="38" y1="20" x2="44" y2="26"/><line x1="80" y1="62" x2="86" y2="68"/>
          <line x1="38" y1="68" x2="44" y2="62"/><line x1="80" y1="26" x2="86" y2="20"/>
        </g>
        <circle cx="62" cy="44" r="19" fill="#ffd23f"/>
      </g>

      <!-- wolken (rustig weer) -->
      <g class="m m-awake" fill="#fff">
        <g class="cloud"><path d="M40,66 a14,14 0 0 1 26,-6 a11,11 0 0 1 20,8 a9,9 0 0 1 -2,18 h-40 a10,10 0 0 1 -4,-20 z" opacity=".95"/></g>
        <g class="cloud two"><path d="M250,40 a11,11 0 0 1 21,-4 a9,9 0 0 1 16,6 a7,7 0 0 1 -2,14 h-32 a8,8 0 0 1 -3,-16 z" opacity=".85"/></g>
      </g>

      <!-- zonnestralen richting de panelen -->
      <g class="m m-sunny" stroke="#ffcf33" stroke-width="2.5" stroke-linecap="round" fill="none">
        <path class="beam" d="M84,52 Q130,40 162,60"/>
        <path class="beam" d="M86,40 Q160,22 204,59" style="animation-delay:-.4s"/>
        <path class="beam" d="M82,30 Q190,4 244,59" style="animation-delay:-.8s"/>
      </g>

      <!-- grond -->
      <rect class="grass" x="-800" y="168" width="2000" height="10"/>
      <rect class="road" x="-800" y="176" width="2000" height="80"/>
      <path d="M-800,189 H1200" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="16 14"/>

      <!-- ===== Bus: zilveren Sprinter W906 hoge camperbus, zijaanzicht, neus rechts ===== -->
      <g transform="translate(116 37) scale(.8)">
        <ellipse cx="172" cy="174" rx="168" ry="5" fill="#000" opacity=".18"/>
        <g class="bob">
          <!-- dak: antenne, dakluik/airco voorin en één zwart zonnepaneel achterin -->
          <path d="M256,47 L262,24" stroke="#2b3440" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M184,45 Q186,34 200,32 H214 Q226,33 230,45 Z" fill="#2a2f37" stroke="#1d2229" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M192,40 Q196,36 206,35.5" stroke="#5c6672" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          <g stroke="#1d2229" stroke-width="1.5">
            <path d="M50,46 v-5 M164,46 v-5" stroke-width="2.5"/>
            <rect x="38" y="33" width="134" height="8" rx="1.5" fill="#22272e"/>
            <path d="M71,33 v8 M105,33 v8 M139,33 v8" stroke="#465060" stroke-width="1"/>
          </g>
          <g class="m m-sunny" fill="#fff">
            <path class="sparkle" d="M64,26 l1.5,4 4,1.5 -4,1.5 -1.5,4 -1.5,-4 -4,-1.5 4,-1.5z"/>
            <path class="sparkle b" d="M118,25 l1.5,4 4,1.5 -4,1.5 -1.5,4 -1.5,-4 -4,-1.5 4,-1.5z"/>
            <path class="sparkle c" d="M158,27 l1.2,3 3,1.2 -3,1.2 -1.2,3 -1.2,-3 -3,-1.2 3,-1.2z"/>
          </g>

          <!-- carrosserie (zilver) -->
          <clipPath id="bus-shape"><path d="M10,46 H252 Q266,46 273,58 L298,104 Q322,110 334,121 Q342,130 342,149 V166 Q342,172 336,172 H8 Q2,172 2,166 V54 Q2,46 10,46 Z"/></clipPath>
          <path class="body" d="M10,46 H252 Q266,46 273,58 L298,104 Q322,110 334,121 Q342,130 342,149 V166 Q342,172 336,172 H8 Q2,172 2,166 V54 Q2,46 10,46 Z"/>
          <g clip-path="url(#bus-shape)">
            <!-- donkergrijze band onderlangs, met zilveren sierlijst eronder -->
            <rect x="0" y="134" width="302" height="16" fill="#4b535e"/>
            <rect x="0" y="162" width="346" height="12" fill="#3a4049"/>
          </g>
          <path class="body-line" fill="none" stroke="#2b3440" stroke-width="2.5" stroke-linejoin="round" d="M10,46 H252 Q266,46 273,58 L298,104 Q322,110 334,121 Q342,130 342,149 V166 Q342,172 336,172 H8 Q2,172 2,166 V54 Q2,46 10,46 Z"/>
          <!-- witte luifelcassette langs de dakrand -->
          <rect x="16" y="40" width="236" height="9" rx="4.5" fill="#f5f7f9" stroke="#2b3440" stroke-width="1.6"/>
          <path d="M22,46.5 H246" stroke="#c9d0d7" stroke-width="1.2"/>
          <!-- deuren: schuifdeur en bestuurdersdeur -->
          <path d="M146,52 V160 M238,50 V160" stroke="#2b3440" stroke-width="1.3" opacity=".55"/>
          <path d="M146,58 H236" stroke="#2b3440" stroke-width="1" opacity=".25"/>
          <rect x="226" y="108" width="8" height="3" rx="1.5" fill="#2b3440" opacity=".75"/>
          <rect x="250" y="108" width="9" height="3" rx="1.5" fill="#2b3440" opacity=".75"/>
          <!-- ramen: klein rond camperraampje achter, groot getint schuifdeurraam, cabineraam -->
          <rect class="tint" x="26" y="64" width="64" height="18" rx="8" stroke="#2b3440" stroke-width="2"/>
          <rect class="tint" x="152" y="62" width="80" height="40" rx="4" stroke="#2b3440" stroke-width="2"/>
          <path class="glass" d="M246,58 H268 Q272,58 274,62 L294,100 H246 Z" stroke="#2b3440" stroke-width="2" stroke-linejoin="round"/>
          <path class="glint" d="M160,96 L178,68 M34,79 L42,68 M252,94 L262,66" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <!-- spiegel -->
          <rect x="286" y="94" width="9" height="15" rx="2.5" fill="#2b3440"/>
          <!-- achterlicht (rood met wit) en oranje zijmarkeringen -->
          <rect x="2" y="96" width="5" height="20" rx="1.5" fill="#d94b3d"/>
          <rect x="2" y="116" width="5" height="8" rx="1.5" fill="#eef0f2"/>
          <rect x="112" y="140" width="6" height="3.5" rx="1.5" fill="#f39a2b"/>
          <rect x="230" y="140" width="6" height="3.5" rx="1.5" fill="#f39a2b"/>
          <rect x="306" y="140" width="6" height="3.5" rx="1.5" fill="#f39a2b"/>
          <!-- zwarte voorbumper -->
          <rect x="300" y="150" width="44" height="20" rx="5" fill="#262b32"/>
          <!-- rvs sidestep tussen de wielen -->
          <path d="M108,158 v6 M232,158 v6" stroke="#6b737d" stroke-width="2.5"/>
          <path d="M100,165 H240" stroke="#2b3440" stroke-width="6" stroke-linecap="round"/>
          <path d="M100,165 H240" stroke="#dfe3e7" stroke-width="3.6" stroke-linecap="round"/>

          <!-- gezicht: koplamp is het oog (iets vergroot, zodat het ook op een telefoon goed te zien is) -->
          <g transform="translate(325 131) scale(1.2) translate(-325 -131)">
          <g class="m m-awake">
            <g class="eye">
              <ellipse cx="324" cy="125" rx="10" ry="8.5" fill="#fff" stroke="#2b3440" stroke-width="2"/>
              <g class="pupil"><circle cx="327" cy="125.5" r="4.2" fill="#1d232b"/><circle cx="328.6" cy="123.8" r="1.4" fill="#fff"/></g>
            </g>
            <path d="M314,140 Q325,149 336,139" fill="none" stroke="#2b3440" stroke-width="2.4" stroke-linecap="round"/>
          </g>
          <g class="m m-sunny">
            <ellipse cx="324" cy="125" rx="10" ry="8.5" fill="#fff" stroke="#2b3440" stroke-width="2"/>
            <!-- zonnebril -->
            <path d="M318,121 L292,112" stroke="#111" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M311,118 H340 Q343,118 342.5,121 L341,127 Q339,135 330,135 H322 Q312,135 311,126 Z" fill="#14171c"/>
            <path class="glint" d="M318,121 L324,121 M316,125 L320,125" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".8"/>
            <!-- brede grijns -->
            <path d="M312,139 Q326,156 339,138 Z" fill="#2b3440"/>
            <path d="M318,142 H334" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          </g>
          <g class="m m-sleeping">
            <path d="M314,125 Q324,132 334,125" fill="none" stroke="#2b3440" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M317,128 l-2,3 M322,130 l-1,3.5 M327,130 l1,3.5 M332,128 l2,3" stroke="#2b3440" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M320,143 Q325,145.5 330,143" fill="none" stroke="#2b3440" stroke-width="2.2" stroke-linecap="round"/>
          </g>
          </g>
        </g>

        <!-- wielen met stalen velgen (staan stil, de bus "ademt" erboven) -->
        <path d="M42,172 A28,28 0 0 1 98,172 Z M244,172 A28,28 0 0 1 300,172 Z" fill="#2b3440"/>
        <g>
          <circle cx="70" cy="172" r="21" fill="#20252c"/><circle cx="70" cy="172" r="12.5" fill="#a9b0b8" stroke="#7c848e" stroke-width="1.5"/><circle cx="77.0" cy="172.0" r="1.6" fill="#5c6470"/><circle cx="73.5" cy="178.1" r="1.6" fill="#5c6470"/><circle cx="66.5" cy="178.1" r="1.6" fill="#5c6470"/><circle cx="63.0" cy="172.0" r="1.6" fill="#5c6470"/><circle cx="66.5" cy="165.9" r="1.6" fill="#5c6470"/><circle cx="73.5" cy="165.9" r="1.6" fill="#5c6470"/><circle cx="70" cy="172" r="4" fill="#d5dade" stroke="#7c848e" stroke-width="1"/>
          <circle cx="272" cy="172" r="21" fill="#20252c"/><circle cx="272" cy="172" r="12.5" fill="#a9b0b8" stroke="#7c848e" stroke-width="1.5"/><circle cx="279.0" cy="172.0" r="1.6" fill="#5c6470"/><circle cx="275.5" cy="178.1" r="1.6" fill="#5c6470"/><circle cx="268.5" cy="178.1" r="1.6" fill="#5c6470"/><circle cx="265.0" cy="172.0" r="1.6" fill="#5c6470"/><circle cx="268.5" cy="165.9" r="1.6" fill="#5c6470"/><circle cx="275.5" cy="165.9" r="1.6" fill="#5c6470"/><circle cx="272" cy="172" r="4" fill="#d5dade" stroke="#7c848e" stroke-width="1"/>
        </g>

        <!-- Zzz -->
        <g class="m m-sleeping" fill="#e9eefb" font-family="system-ui, sans-serif" font-weight="800">
          <text class="z" x="338" y="104" font-size="14">z</text>
          <text class="z b" x="338" y="104" font-size="18">Z</text>
          <text class="z c" x="338" y="104" font-size="22">Z</text>
        </g>
      </g>
    </svg>
    <div class="caption" aria-live="polite">
      <strong id="mood-title">Even kijken hoe het gaat…</strong>
      <span id="mood-text">Gegevens ophalen.</span>
    </div>
  </section>

  <!-- ===================== Accu en zon ===================== -->
  <section class="stats" aria-label="Accu en zonnepanelen">
    <article class="card stat" aria-labelledby="bat-title">
      <div class="stat-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="18" height="12" rx="2"/><path d="M22 11v4M6 11v4M10 13h0"/></svg>
        <h3 id="bat-title">Huishoudaccu</h3><small>BMV-712</small>
      </div>
      <div id="bat"><p class="nodata">Gegevens ophalen…</p></div>
    </article>
    <article class="card stat" aria-labelledby="sol-title">
      <div class="stat-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <h3 id="sol-title">Zonnepanelen</h3><small>SmartSolar MPPT</small>
      </div>
      <div id="sol"><p class="nodata">Gegevens ophalen…</p></div>
    </article>
  </section>

  <!-- ===================== Relais ===================== -->
  <h2>Relais</h2>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>
<div class="toast" id="toast" role="alert"></div>

<script>
(() => {
  const STATUS_MS = 2000;
  const RELAYS_MS = 3000;
  const $ = id => document.getElementById(id);
  const grid = $('grid'), conn = $('conn'), toastEl = $('toast'), scene = $('scene');

  let relayData = null;     // laatste relaislijst van de server
  let editing = null;       // kanaal waarvan de naam bewerkt wordt
  let busy = false;         // relaisverzoek onderweg: niet tussendoor verversen

  const pencil = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

  // ---------- hulpjes ----------
  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    for (const c of children) node.append(c);
    return node;
  }
  const nf = new Map();
  function num(value, decimals = 1) {
    if (value === null || value === undefined) return '–';
    if (!nf.has(decimals)) nf.set(decimals, new Intl.NumberFormat('nl-NL', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }));
    return nf.get(decimals).format(value);
  }
  function duration(minutes) {
    if (minutes === null || minutes === undefined) return '–';
    const d = Math.floor(minutes / 1440), h = Math.floor(minutes % 1440 / 60), m = minutes % 60;
    return d > 0 ? d + ' d ' + h + ' u' : h + ' u ' + String(m).padStart(2, '0') + ' m';
  }
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3500);
  }
  function setOnline(ok) {
    conn.textContent = ok ? 'Verbonden' : 'Geen verbinding';
    conn.classList.toggle('offline', !ok);
  }

  async function api(path, options = {}) {
    const headers = Object.assign({ 'X-BusDash': '1' }, options.headers || {});
    const res = await fetch('api/' + path, Object.assign({}, options, { headers }));
    if (res.status === 401) { location.href = 'login'; throw new Error('Niet ingelogd'); }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ('Fout ' + res.status));
    return body;
  }

  // ---------- stemming, accu en zon ----------
  const moods = {
    sunny: s => ['Zonnebril op!', 'De zon levert ' + num(s.solar.panelPower, 0) + ' W, de accu wordt flink geladen.'],
    sleeping: s => ['Slaap lekker', s.battery ? 'Het is nacht. Accu op ' + num(s.battery.soc, 0) + '%.' : 'Het is nacht.'],
    awake: s => {
      if (!s.solar && !s.battery) return ['Lekker wakker', 'Nog geen meetgegevens binnen.'];
      if (s.solar && s.solar.panelPower > 0) return ['Lekker wakker', 'Een beetje zon: ' + num(s.solar.panelPower, 0) + ' W. Alles rustig.'];
      return ['Lekker wakker', s.battery ? 'Alles rustig. Accu op ' + num(s.battery.soc, 0) + '%.' : 'Alles rustig.'];
    }
  };

  function row(label, value) {
    return el('div', {}, el('dt', { textContent: label }), el('dd', { textContent: value, title: value }));
  }
  function bar(fraction, cls, color) {
    const i = el('i');
    i.style.width = Math.max(0, Math.min(100, fraction * 100)) + '%';
    if (color) i.style.background = color;
    return el('div', { className: 'bar' + (cls ? ' ' + cls : '') }, i);
  }
  function nodata(connected) {
    return el('p', { className: 'nodata', textContent: connected ? 'Geen actuele gegevens (kabel los?)' : 'Niet aangesloten' });
  }

  function renderBattery(s) {
    const b = s.battery, box = $('bat');
    if (!b) { box.replaceChildren(nodata(s.batteryConnected)); return; }
    const soc = b.soc;
    const color = soc === null ? null : soc < 20 ? 'var(--danger)' : soc < 50 ? 'var(--warn)' : null;
    const charging = b.current > 0.05, discharging = b.current < -0.05;
    const rows = [
      row('Spanning', num(b.voltage, 2) + ' V'),
      row(charging ? 'Laadstroom' : discharging ? 'Verbruik' : 'Stroom', num(Math.abs(b.current), 1) + ' A'),
      row('Vermogen', b.power === null ? '–' : num(b.power, 0) + ' W'),
      row('Resterend', charging ? 'Laden' : duration(b.timeToGoMinutes)),
    ];
    if (b.consumedAh !== null) rows.push(row('Verbruikt', num(Math.abs(b.consumedAh), 1) + ' Ah'));
    if (b.temperature !== null) rows.push(row('Temperatuur', num(b.temperature, 0) + ' °C'));
    if (b.starterVoltage !== null) rows.push(row('Startaccu', num(b.starterVoltage, 2) + ' V'));
    box.replaceChildren(
      el('div', { className: 'big' }, el('b', { textContent: soc === null ? '–' : num(soc, 0) + '%' }),
         el('span', { textContent: soc === null ? 'nog niet gesynchroniseerd' : charging ? 'aan het laden' : discharging ? 'in gebruik' : 'in rust' })),
      bar(soc === null ? 0 : soc / 100, '', color),
      el('dl', {}, ...rows));
  }

  function renderSolar(s) {
    const p = s.solar, box = $('sol');
    if (!p) { box.replaceChildren(nodata(s.solarConnected)); return; }
    const max = Math.max(p.maxPowerToday || 0, s.sunnyWatts * 3, p.panelPower);
    const rows = [
      row('Paneelspanning', num(p.panelVoltage, 1) + ' V'),
      row('Laadstroom', p.batteryCurrent === null ? '–' : num(p.batteryCurrent, 1) + ' A'),
      row('Laadstatus', p.stateLabel || '–'),
      row('Vandaag', p.yieldTodayKWh === null ? '–' : num(p.yieldTodayKWh, 2) + ' kWh'),
      row('Max vandaag', p.maxPowerToday === null ? '–' : num(p.maxPowerToday, 0) + ' W'),
    ];
    if (p.errorCode) rows.push(row('Storing', 'code ' + p.errorCode));
    box.replaceChildren(
      el('div', { className: 'big' }, el('b', { textContent: num(p.panelPower, 0) + ' W' }),
         el('span', { textContent: p.panelPower > 0 ? 'van de zon' : 'geen zon' })),
      bar(p.panelPower / max, 'sun'),
      el('dl', {}, ...rows));
  }

  async function refreshStatus() {
    try {
      const s = await api('status');
      setOnline(true);
      scene.dataset.mood = s.mood;
      const [title, text] = (moods[s.mood] || moods.awake)(s);
      $('mood-title').textContent = title;
      $('mood-text').textContent = text;
      renderBattery(s);
      renderSolar(s);
      $('logout').hidden = !s.user;
      $('logout').textContent = s.user ? 'Uitloggen' : '';
      $('logout').title = s.user ? 'Ingelogd als ' + s.user : '';
    } catch (e) {
      setOnline(false);
    }
  }

  $('logout').addEventListener('click', async () => {
    try { await fetch('logout', { method: 'POST', headers: { 'X-BusDash': '1' } }); } catch (e) { /* toch doorsturen */ }
    location.href = 'login';
  });

  // ---------- relais ----------
  async function relayAction(channel, act, body) {
    busy = true;
    try {
      relayData = await api('relays/' + channel + '/' + act, {
        method: 'POST',
        headers: body === undefined ? {} : { 'Content-Type': 'text/plain; charset=utf-8' },
        body
      });
      setOnline(true);
      return true;
    } catch (e) {
      toast(e instanceof TypeError ? 'Geen verbinding met de Pi' : e.message);
      if (e instanceof TypeError) setOnline(false);
      return false;
    } finally {
      busy = false;
      renderRelays();
    }
  }

  function relayCard(r) {
    const card = el('div', { className: 'card relay' + (r.on ? ' on' : '') });
    const badge = el('div', { className: 'num', textContent: r.channel, title: 'Kanaal ' + r.channel });

    if (editing === r.channel) {
      const input = el('input', { type: 'text', value: r.name, maxLength: relayData.maxNameLength, autocomplete: 'off', enterKeyHint: 'done' });
      input.setAttribute('aria-label', 'Naam van relais ' + r.channel);
      const save = async () => {
        const name = input.value.trim();
        if (!name) { toast('Naam mag niet leeg zijn'); input.focus(); return; }
        if (name === r.name) { editing = null; renderRelays(); return; }
        if (await relayAction(r.channel, 'name', name)) { editing = null; renderRelays(); }
      };
      const cancel = () => { editing = null; renderRelays(); };
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); save(); }
        if (e.key === 'Escape') cancel();
      });
      const remove = el('button', { className: 'btn danger', type: 'button', textContent: 'Verwijderen' });
      remove.addEventListener('click', async () => {
        if (!confirm('"' + r.name + '" verwijderen uit het dashboard? Het relais gaat dan uit.')) return;
        editing = null;
        await relayAction(r.channel, 'hide');
      });
      const saveBtn = el('button', { className: 'btn primary', type: 'button', textContent: 'Opslaan' });
      saveBtn.addEventListener('click', save);
      const cancelBtn = el('button', { className: 'btn', type: 'button', textContent: 'Annuleren' });
      cancelBtn.addEventListener('click', cancel);
      card.append(badge, el('div', { className: 'edit' }, input, el('div', { className: 'edit-actions' }, saveBtn, cancelBtn, remove)));
      requestAnimationFrame(() => { input.focus(); input.select(); });
      return card;
    }

    const editBtn = el('button', { className: 'icon-btn', type: 'button', innerHTML: pencil, title: 'Naam wijzigen' });
    editBtn.setAttribute('aria-label', 'Naam van ' + r.name + ' wijzigen');
    editBtn.addEventListener('click', () => { editing = r.channel; renderRelays(); });

    const sw = el('button', { className: 'switch', type: 'button' });
    sw.setAttribute('role', 'switch');
    sw.setAttribute('aria-checked', String(r.on));
    sw.setAttribute('aria-label', r.name);
    sw.addEventListener('click', async () => {
      sw.disabled = true;
      sw.setAttribute('aria-checked', String(!r.on)); // direct tonen, server bevestigt
      await relayAction(r.channel, r.on ? 'off' : 'on');
    });

    card.append(badge,
      el('div', { className: 'info' },
        el('div', { className: 'name-row' }, el('span', { className: 'name', textContent: r.name, title: r.name }), editBtn),
        el('div', { className: 'state', textContent: r.on ? 'Aan' : 'Uit' })),
      sw);
    return card;
  }

  function addButton(visibleCount) {
    const next = relayData.relays.find(r => !r.visible);
    const btn = el('button', { className: 'add', type: 'button' });
    if (!next) {
      btn.disabled = true;
      btn.append('Alle ' + relayData.max + ' relais in gebruik');
      return btn;
    }
    btn.append(el('span', { className: 'plus', textContent: '+' }),
               el('span', { textContent: 'Relais toevoegen (' + visibleCount + '/' + relayData.max + ')' }));
    btn.setAttribute('aria-label', 'Relais ' + next.channel + ' toevoegen');
    btn.addEventListener('click', async () => {
      if (await relayAction(next.channel, 'show')) { editing = next.channel; renderRelays(); }
    });
    return btn;
  }

  function renderRelays() {
    if (!relayData) return;
    const visible = relayData.relays.filter(r => r.visible);
    grid.replaceChildren(...visible.map(relayCard), addButton(visible.length));
  }

  async function refreshRelays() {
    if (busy || editing !== null) return; // niet storen tijdens schakelen of typen
    try {
      relayData = await api('relays');
      setOnline(true);
      renderRelays();
    } catch (e) {
      setOnline(false);
    }
  }

  refreshStatus();
  refreshRelays();
  setInterval(refreshStatus, STATUS_MS);
  setInterval(refreshRelays, RELAYS_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshStatus(); refreshRelays(); } });
})();
</script>
</body>
</html>
