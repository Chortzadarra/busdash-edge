<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<title>BusDash – Inloggen</title>
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --text: #1d1f22; --muted: #6b6f76; --line: #e3e0da;
    --accent: #1f8a5b; --danger: #b3362b; --focus: #2d6cdf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --card: #202327; --text: #eceae6; --muted: #9a9ea5; --line: #30343a;
      --accent: #3fbf86; --danger: #ef6b5f; --focus: #7aa7ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  form {
    width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px 24px 24px; display: grid; gap: 16px;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo svg { width: 52px; height: 34px; flex: none; }
  h1 { font-size: 1.375rem; margin: 0; }
  h1 small { display: block; font-size: .875rem; font-weight: 500; color: var(--muted); }
  label { display: grid; gap: 6px; font-size: .875rem; font-weight: 600; }
  input {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; min-height: 48px; width: 100%;
  }
  input:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
  button {
    font: inherit; font-weight: 700; color: #fff; background: var(--accent); border: 0;
    border-radius: 10px; min-height: 48px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .error { color: var(--danger); font-size: .9375rem; margin: 0; }
  .error:empty { display: none; }
</style>
</head>
<body>
<form method="post" action="login">
  <div class="logo">
    <svg viewBox="0 0 52 34" aria-hidden="true">
      <path d="M3,6 H38 Q41,6 42.5,8.5 L46,16 Q50,17 51,19.5 V27 Q51,28 50,28 H2 Q1,28 1,27 V8 Q1,6 3,6 Z" fill="var(--card)" stroke="var(--text)" stroke-width="1.6"/>
      <rect x="6" y="10" width="11" height="6" rx="1.5" fill="var(--muted)"/>
      <path d="M36,10 H40 L43.5,16 H36 Z" fill="var(--muted)"/>
      <circle cx="11" cy="28" r="4.2" fill="var(--text)"/><circle cx="41" cy="28" r="4.2" fill="var(--text)"/>
      <circle cx="47" cy="20.5" r="1.6" fill="var(--accent)"/>
    </svg>
    <h1>BusDash <small>Log in om verder te gaan</small></h1>
  </div>
  <p class="error" id="error" role="alert"></p>
  <label>Gebruikersnaam
    <input name="user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
  </label>
  <label>Wachtwoord
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <button type="submit">Inloggen</button>
</form>
<script>
  const fout = new URLSearchParams(location.search).get('fout');
  if (fout) {
    document.getElementById('error').textContent = fout === 'geblokkeerd'
      ? 'Te veel foute pogingen. Probeer het over een paar minuten opnieuw.'
      : 'Gebruikersnaam of wachtwoord klopt niet.';
  }
</script>
</body>
</html>
